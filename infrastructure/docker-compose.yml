services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zcg
      POSTGRES_PASSWORD: zcg
      POSTGRES_DB: zcg_ci
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zcg -d zcg_ci"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://zcg:zcg@postgres:5432/zcg_ci?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.worker
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://zcg:zcg@postgres:5432/zcg_ci?schema=public
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    environment:
      API_PUBLIC_URL: http://api:4000
      COOKIE_NAME: zcg_session
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
