name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zcg
          POSTGRES_PASSWORD: zcg
          POSTGRES_DB: zcg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zcg -d zcg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zcg:zcg@localhost:5432/zcg_ci?schema=public
      JWT_SECRET: ci-secret-not-for-production
      SEED_ADMIN_EMAIL: admin@zcg.local
      SEED_ADMIN_PASSWORD: ci-admin-password-change
      TELEPHONY_PROVIDER: fake
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json#packageManager (pnpm@10.33.3)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zcg/database generate
      - run: pnpm --filter @zcg/database exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @zcg/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          API_PUBLIC_URL: http://localhost:4000
      - run: pnpm --filter @zcg/api typecheck
